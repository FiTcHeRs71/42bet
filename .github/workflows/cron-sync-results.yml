name: cron-sync-results

# Déclenche le scoring 42Bet (endpoint /api/cron/sync-results, protégé par
# CRON_SECRET — cf. src/app/api/cron/sync-results/route.ts, header Bearer).
#
# ⚠️ Le `schedule` GitHub Actions a été RETIRÉ : en pratique le scheduler
# Actions est fortement throttlé (best-effort, trous de plusieurs heures
# observés en prod), ce qui retardait le scoring après la fin d'un match.
# Le tick périodique fiable est désormais assuré par un pinger externe
# (cron-job.org, toutes les 2 min) — cf. docs/deploy.md §5.3.
#
# Ce workflow reste comme FILET MANUEL : déclenchable à la main via l'onglet
# Actions (workflow_dispatch) pour forcer un scoring immédiat si besoin.
#
# Secrets repo requis (Settings → Secrets and variables → Actions) :
#   PROD_URL     ex. https://42bet.vercel.app  (sans slash final)
#   CRON_SECRET  même valeur que la var d'env Vercel Production

on:
  workflow_dispatch: {} # déclenchement manuel uniquement (filet de secours)

concurrency:
  group: cron-sync-results
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync-results
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.PROD_URL }}/api/cron/sync-results")
          echo "HTTP $code"
          test "$code" = "200"
